<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ฤทธิ์ชัยอนันต์ การยาง</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #f4f7f5;
  color: #222;
}

.header {
  background: #176b3a;
  color: white;
  text-align: center;
  padding: 28px 15px;
  border-radius: 0 0 28px 28px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 8px 0 0;
  font-size: 14px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.welcome {
  background: white;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.welcome h2 {
  margin: 0 0 5px;
  font-size: 19px;
}

.welcome p {
  margin: 0;
  color: #777;
  font-size: 14px;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.menu button {
  border: 0;
  border-radius: 20px;
  background: white;
  padding: 22px 10px;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.icon {
  display: block;
  font-size: 32px;
  margin-bottom: 8px;
}

.price {
  background: #e8f6ed !important;
}

.reward {
  background: #fff5d9 !important;
}

.sales {
  background: #eaf0ff !important;
}

.receipt {
  background: #fff0f0 !important;
}

.customer {
  background: #e9faff !important;
}

.contact {
  background: #f3ebff !important;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="header">
  <h1>ฤทธิ์ชัยอนันต์ การยาง</h1>
  <p>ระบบบริการลูกค้า</p>
</div>

<div class="container">

  <div class="welcome">
    <h2>สวัสดีค่ะ 👋</h2>
    <p>ยินดีต้อนรับเข้าสู่ระบบบริการของร้าน</p>
  </div>

  <div class="menu">

    <button class="price" onclick="showPrice()">
      <span class="icon">💰</span>
      ราคาวันนี้
    </button>

    <button class="reward" onclick="showReward()">
      <span class="icon">🎁</span>
      สะสมแต้ม / รางวัล
    </button>

    <button class="sales" onclick="showSales()">
      <span class="icon">📊</span>
      เช็กยอดขาย
    </button>

    <button class="receipt" onclick="showReceipt()">
      <span class="icon">🧾</span>
      ใบเสร็จออนไลน์
    </button>

    <button class="customer" onclick="showCustomer()">
      <span class="icon">👤</span>
      ข้อมูลลูกค้า
    </button>

    <button class="contact" onclick="showContact()">
      <span class="icon">📞</span>
      ติดต่อเรา
    </button>

  </div>

  <div class="footer">
    © ฤทธิ์ชัยอนันต์ การยาง
  </div>

</div>

<script>

function showPrice() {
  alert("ราคายางวันนี้\n\nยางก้อนถ้วย\nกรุณาติดตามราคาประจำวัน");
}

function showReward() {
  alert("ระบบสะสมแต้ม / รางวัล\n\nกำลังเตรียมระบบ");
}

function showSales() {
  alert("ระบบเช็กยอดขาย\n\nกำลังเตรียมระบบ");
}

function showReceipt() {
  alert("ใบเสร็จออนไลน์\n\nกำลังเตรียมระบบ");
}

function showCustomer() {
  alert("ข้อมูลลูกค้า\n\nกำลังเตรียมระบบ");
}

function showContact() {
  alert(
    "ฤทธิ์ชัยอนันต์ การยาง\n\n" +
    "เปิดบริการ 07:00 - 17:00 น.\n" +
    "หยุดทุกวันเสาร์"
  );
}

</script>

</body>
</html>
